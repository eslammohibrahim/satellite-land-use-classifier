<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Satellite Land-Use Classifier</title>
<style>
  :root { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b; --accent: #2563eb; --border: #e2e8f0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff; --border: #30363d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 48px auto; padding: 0 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  label.drop { display: block; border: 2px dashed var(--border); border-radius: 10px; padding: 28px; text-align: center; cursor: pointer; color: var(--muted); }
  label.drop:hover { border-color: var(--accent); }
  input[type=file] { display: none; }
  .result { display: none; margin-top: 20px; gap: 16px; align-items: flex-start; }
  .result img { width: 128px; height: 128px; object-fit: cover; border-radius: 8px; image-rendering: pixelated; }
  .bars { flex: 1; }
  .row { margin-bottom: 10px; }
  .row .name { display: flex; justify-content: space-between; font-size: 0.95rem; }
  .bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-top: 4px; }
  .bar span { display: block; height: 100%; background: var(--accent); }
  .error { color: #dc2626; margin-top: 12px; }
  .examples { margin-top: 16px; }
  .examples small { color: var(--muted); display: block; margin-bottom: 8px; }
  .examples .grid { display: flex; gap: 8px; flex-wrap: wrap; }
  .examples button { padding: 0; border: 2px solid transparent; border-radius: 8px; background: none; cursor: pointer; }
  .examples button:hover, .examples button:focus-visible { border-color: var(--accent); outline: none; }
  .examples img { display: block; width: 56px; height: 56px; border-radius: 6px; image-rendering: pixelated; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Satellite Land-Use Classifier</h1>
  <p>Upload a satellite image. The model predicts one of 10 land-use classes. <a href="/docs">API docs</a></p>
  <div class="card">
    <label class="drop" for="file">Click to choose an image (PNG or JPG)</label>
    <input id="file" type="file" accept="image/*">
    <div class="examples">
      <small>Or try an example from the test set:</small>
      <div class="grid" id="examples"></div>
    </div>
    <div class="result" id="result">
      <img id="preview" alt="Uploaded image">
      <div class="bars" id="bars"></div>
    </div>
    <div class="error" id="error"></div>
  </div>
</main>
<script>
  const fileInput = document.getElementById("file");
  const EXAMPLES = ["river", "residential", "forest", "highway", "annualcrop", "sealake"];

  document.getElementById("examples").innerHTML = EXAMPLES.map(name =>
    `<button type="button" data-name="${name}" title="${name}">
       <img src="/static/examples/${name}.png" alt="Example: ${name}">
     </button>`).join("");
  document.getElementById("examples").addEventListener("click", async (event) => {
    const button = event.target.closest("button");
    if (!button) return;
    const blob = await (await fetch(`/static/examples/${button.dataset.name}.png`)).blob();
    classify(new File([blob], `${button.dataset.name}.png`, { type: "image/png" }));
  });
  fileInput.addEventListener("change", () => {
    if (fileInput.files[0]) classify(fileInput.files[0]);
  });

  async function classify(file) {
    document.getElementById("error").textContent = "";
    document.getElementById("preview").src = URL.createObjectURL(file);
    const body = new FormData();
    body.append("file", file);
    const res = await fetch("/predict", { method: "POST", body });
    const data = await res.json();
    if (!res.ok) {
      document.getElementById("error").textContent = data.detail || "Something went wrong.";
      document.getElementById("result").style.display = "none";
      return;
    }
    document.getElementById("bars").innerHTML = data.top3.map(p => `
      <div class="row">
        <div class="name"><span>${p.label}</span><span>${(p.probability * 100).toFixed(1)}%</span></div>
        <div class="bar"><span style="width:${p.probability * 100}%"></span></div>
      </div>`).join("");
    document.getElementById("result").style.display = "flex";
  }
</script>
</body>
</html>
